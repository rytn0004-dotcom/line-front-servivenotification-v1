name: Render健康檢查 Keep Alive

on:
  # Use UTC cron times for scheduler reliability; Taiwan time is UTC+8.
  # Sunday–Friday Taipei: pre-warm 12:57, then ping every 10 minutes 13:05–22:55.
  # Saturday Taipei: pre-warm 06:57, then ping every 10 minutes 07:05–18:55.
  # The push trigger validates the workflow when this file changes; regular runs use schedule.
  push:
    paths:
      - '.github/workflows/render-health-ping.yml'
  schedule:
    # Sunday–Friday Taipei 12:57 = 04:57 UTC, same UTC weekday.
    - cron: '57 4 * * 0-5'
    # Sunday–Friday Taipei 13:05–22:55 = 05:05–14:55 UTC.
    - cron: '5,15,25,35,45,55 5-14 * * 0-5'
    # Saturday Taipei 06:57 = Friday 22:57 UTC.
    - cron: '57 22 * * 5'
    # Saturday Taipei 07:05–07:55 = Friday 23:05–23:55 UTC.
    - cron: '5,15,25,35,45,55 23 * * 5'
    # Saturday Taipei 08:05–18:55 = Saturday 00:05–10:55 UTC.
    - cron: '5,15,25,35,45,55 0-10 * * 6'
  workflow_dispatch:

concurrency:
  group: render-health-ping
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    env:
      RENDER_HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
    steps:
      - name: Check configuration
        run: |
          if [ -z "${RENDER_HEALTH_URL:-}" ]; then
            echo "Missing GitHub Actions repository variable: RENDER_HEALTH_URL"
            echo "Set it to your Render service health endpoint, for example https://your-service.onrender.com/health"
            exit 1
          fi

      - name: Keep Render service warm
        run: |
          echo "Taipei time: $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Pinging ${RENDER_HEALTH_URL}"
          curl --fail --silent --show-error \
            --location \
            --connect-timeout 10 \
            --max-time 20 \
            --retry 2 \
            --retry-delay 2 \
            --retry-all-errors \
            -H 'User-Agent: GitHubActions-Render-Health-Ping/1.0' \
            "${RENDER_HEALTH_URL}"
          echo
          echo "Render health check succeeded."
