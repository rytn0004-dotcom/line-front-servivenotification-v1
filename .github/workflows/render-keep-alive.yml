name: Render客服 Keep Alive

on:
  # GitHub scheduled workflows can be delayed; avoid minute 0 and use an 8-minute cadence.
  # Sunday–Friday: 12:57 Taipei pre-warm, then run around every 8 minutes from 13:03 to 22:59.
  # Saturday: 06:57 Taipei pre-warm, then run around every 8 minutes from 07:03 to 18:59.
  schedule:
    - cron: '57 12 * * 0-5'
      timezone: 'Asia/Taipei'
    - cron: '3-59/8 13-22 * * 0-5'
      timezone: 'Asia/Taipei'
    - cron: '57 6 * * 6'
      timezone: 'Asia/Taipei'
    - cron: '3-59/8 7-18 * * 6'
      timezone: 'Asia/Taipei'
  workflow_dispatch:

concurrency:
  group: render-customer-service-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    env:
      RENDER_HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
    steps:
      - name: Check configuration
        run: |
          if [ -z "${RENDER_HEALTH_URL:-}" ]; then
            echo "Missing GitHub Actions repository variable: RENDER_HEALTH_URL"
            echo "Example: https://your-render-service.onrender.com/health"
            exit 1
          fi

      - name: Keep Render service warm
        run: |
          echo "Pinging ${RENDER_HEALTH_URL}"
          curl --fail --silent --show-error \
            --location \
            --connect-timeout 10 \
            --max-time 20 \
            --retry 2 \
            --retry-delay 2 \
            --retry-all-errors \
            -H 'User-Agent: GitHubActions-Render-KeepAlive/1.0' \
            "${RENDER_HEALTH_URL}"
          echo
          echo "Render keep-alive ping succeeded."
