name: Render客服 Keep Alive（舊版手動測試）

on:
  # Keep manual testing available; scheduled checks are handled by render-health-ping.yml.
  workflow_dispatch:

concurrency:
  group: render-customer-service-keepalive-manual
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    env:
      RENDER_HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
    steps:
      - name: Check configuration
        run: |
          if [ -z "${RENDER_HEALTH_URL:-}" ]; then
            echo "Missing GitHub Actions repository variable: RENDER_HEALTH_URL"
            echo "Example: https://your-render-service.onrender.com/health"
            exit 1
          fi

      - name: Keep Render service warm
        run: |
          echo "Pinging ${RENDER_HEALTH_URL}"
          curl --fail --silent --show-error \
            --location \
            --connect-timeout 10 \
            --max-time 20 \
            --retry 2 \
            --retry-delay 2 \
            --retry-all-errors \
            -H 'User-Agent: GitHubActions-Render-KeepAlive/1.0' \
            "${RENDER_HEALTH_URL}"
          echo
          echo "Render keep-alive ping succeeded."
