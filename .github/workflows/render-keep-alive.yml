name: Render客服 Keep Alive

on:
  # GitHub Actions scheduled workflows use the timezone below.
  # 12:57 Taipei: pre-warm the Render service before the 13:00 service window.
  # 13:02–22:57 Taipei: ping every 5 minutes so Render receives inbound traffic
  # well before its 15-minute free-tier idle shutdown threshold.
  schedule:
    - cron: '57 12 * * *'
      timezone: 'Asia/Taipei'
    - cron: '2-59/5 13-22 * * *'
      timezone: 'Asia/Taipei'
  workflow_dispatch:

concurrency:
  group: render-customer-service-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    env:
      RENDER_HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
    steps:
      - name: Check configuration
        run: |
          if [ -z "${RENDER_HEALTH_URL:-}" ]; then
            echo "Missing GitHub Actions repository variable: RENDER_HEALTH_URL"
            echo "Example: https://your-render-service.onrender.com/health"
            exit 1
          fi

      - name: Keep Render service warm
        run: |
          echo "Pinging ${RENDER_HEALTH_URL}"
          curl --fail --silent --show-error \
            --location \
            --connect-timeout 10 \
            --max-time 20 \
            --retry 2 \
            --retry-delay 2 \
            --retry-all-errors \
            -H 'User-Agent: GitHubActions-Render-KeepAlive/1.0' \
            "${RENDER_HEALTH_URL}"
          echo
          echo "Render keep-alive ping succeeded."
